name: Node.js CI

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '22.13.1' # Adjust to the appropriate Node.js version
      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.DEPLOY_RSA }}
          known_hosts: unnecessary

      - name: Adding Known Hosts
        run: ssh-keyscan -H ituk.ee >> ~/.ssh/known_hosts
      - name: Build
        run: docker build -t svelte-ituk-ee .
      - name: Stop old container
        run: ssh deploy@ituk.ee 'docker rm $(docker stop $(docker ps -a -q --filter ancestor=svelte-ituk-ee --format="{{.ID}}")) || echo Failed to stop old container!'
      - name: Push container to server
        run: docker save svelte-ituk-ee | ssh -C deploy@ituk.ee docker load
      - name: Start new container
        run: ssh deploy@ituk.ee "docker run -d -p 6969:3000 svelte-ituk-ee || echo Failed to start new container!"
      - name: Cleanup SSH keys
        run: rm ~/.ssh/id_rsa
